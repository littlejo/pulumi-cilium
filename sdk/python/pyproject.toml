[project]
  name = "littlejo_cilium"
  description = "A Pulumi package for creating and managing Cilium resources"
  dependencies = ["packaging>=24.0", "pulumi>=3.269.0,<4.0.0", "semver>=2.8.1", "typing-extensions>=4.11,<5; python_version < \"3.11\""]
  keywords = ["pulumi", "cilium", "category/network"]
  license = "Apache-2.0"
  readme = "README.md"
  requires-python = ">=3.10"
  version = "0.0.0a0+dev"
  [project.urls]
    Homepage = "https://github.com/littlejo/pulumi-cilium"
    Repository = "https://github.com/littlejo/pulumi-cilium"

[build-system]
  requires = ["setuptools>=77.0"]
  build-backend = "setuptools.build_meta"

[tool]
  [tool.setuptools]
    [tool.setuptools.package-data]
      littlejo_cilium = ["py.typed", "pulumi-plugin.json"]
