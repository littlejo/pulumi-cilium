version: "2"

run:
  timeout: 20m

linters:
  # The "standard" set brings errcheck, govet, ineffassign, staticcheck and unused.
  enable:
    - goconst
    - gosec
    - lll
    - misspell
    - nakedret
    - revive
    - unconvert
  settings:
    lll:
      line-length: 140

formatters:
  enable:
    - gofmt
    - goimports
