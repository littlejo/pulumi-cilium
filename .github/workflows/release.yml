name: Release

on:
  push:
    tags:
      - v*.*.*

permissions:
  contents: read

env:
  # renovate: datasource=github-releases depName=pulumi/pulumi
  PULUMI_VERSION: 3.277.0

jobs:
  provider:
    name: Publish the provider
    runs-on: ubuntu-latest
    permissions:
      contents: write # create the release and the tag of the Go SDK
      id-token: write # sign the checksums and attest the archives
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
      - uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de # v7.3.0
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.tar.gz

      # The Go SDK is a module in the sdk directory: Go looks for its versions in tags prefixed with "sdk/".
      - name: Tag the Go SDK
        run: |
          git tag "sdk/${GITHUB_REF_NAME}" "${GITHUB_SHA}"
          git push origin "sdk/${GITHUB_REF_NAME}"

  python:
    name: Publish the Python SDK
    needs: provider
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/littlejo-cilium
    permissions:
      id-token: write # PyPI trusted publishing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}
      - name: Build the SDK
        run: make build_python PROVIDER_VERSION="${GITHUB_REF_NAME#v}"
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: sdk/python/bin/dist

  nodejs:
    name: Publish the Node.js SDK
    needs: provider
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@littlejo/cilium
    permissions:
      id-token: write # npm trusted publishing and provenance
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7.1.0
        with:
          go-version-file: provider/go.mod
          cache-dependency-path: provider/go.sum
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          registry-url: https://registry.npmjs.org
      - uses: pulumi/actions@96c7761824268174e0d2a4e8c7d75671eebd24a7 # v7.1.0
        with:
          pulumi-version: ${{ env.PULUMI_VERSION }}
      - name: Build the SDK
        run: make build_nodejs PROVIDER_VERSION="${GITHUB_REF_NAME#v}"
      - name: Publish the SDK
        working-directory: sdk/nodejs/bin
        env:
          # Only needed for the first publication: afterwards, configure trusted publishing on npmjs.com
          # and delete the NPM_TOKEN secret.
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # Pre-releases must not become the "latest" version.
          case "${GITHUB_REF_NAME}" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          npm publish --provenance --access public --tag "${tag}"
