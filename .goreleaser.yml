version: 2

before:
  hooks:
    - make schema_embed PROVIDER_VERSION={{ .Version }}

builds:
  - binary: pulumi-resource-cilium
    dir: provider
    main: ./cmd/pulumi-resource-cilium/
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      # Must match the module of provider/go.mod.
      - -s -w -X github.com/littlejo/pulumi-cilium/provider/pkg/version.Version={{ .Version }}

archives:
  # Pulumi downloads the plugin from the release with this name.
  - name_template: "{{ .Binary }}-{{ .Tag }}-{{ .Os }}-{{ .Arch }}"

checksum:
  name_template: checksums.txt

signs:
  # Keyless signature of the checksums with the OIDC token of the release workflow.
  - cmd: cosign
    artifacts: checksum
    signature: ${artifact}.sigstore.json
    args:
      - sign-blob
      - --bundle=${signature}
      - ${artifact}
      - --yes

changelog:
  use: github-native

release:
  prerelease: auto

snapshot:
  version_template: "{{ incpatch .Version }}-SNAPSHOT"
